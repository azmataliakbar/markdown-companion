<!DOCTYPE html>
<html lang="en" data-layout="mobile">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Markdown Cheat-Sheet Companion: write Markdown with a live preview, a one-click cheat sheet and a .md download. Zero dependencies. Saved in this browser only.">
  <meta name="theme-color" content="#0b0b16">
  <title>Markdown Companion | Idea By Azmat Ali</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Markdown Companion | Idea By Azmat Ali">
  <meta property="og:description" content="Write Markdown with a live preview, a cheat sheet and a .md download.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">M&#8595;</span>
      <div>
        <h1>Markdown Companion</h1>
        <p class="tag">Write · preview · export</p>
      </div>
    </div>
    <button type="button" class="btn ghost small" id="new-doc">New</button>
  </header>

  <main class="workbench">

    <!-- Quick cheat sheet -->
    <section class="sidebar panel" data-section="cheat" aria-labelledby="h-cheat">
      <h2 class="panel-title" id="h-cheat">Quick cheat-sheet</h2>
      <p class="hint">Tap an item to insert it at the cursor.</p>
      <ul class="cheat" id="cheat-list"></ul>
    </section>

    <!-- Editor canvas -->
    <section class="editor panel" data-section="editor" aria-labelledby="h-editor">
      <div class="panel-head">
        <h2 class="panel-title" id="h-editor">Editor canvas</h2>
        <div class="counters" aria-live="polite">
          <span class="counter" id="count-words">0 words</span>
          <span class="counter" id="count-chars">0 chars</span>
        </div>
      </div>

      <div class="toolbar" role="toolbar" aria-label="Formatting tools">
        <button type="button" class="tool" data-tool="h1" title="Heading 1">H1</button>
        <button type="button" class="tool" data-tool="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
        <button type="button" class="tool" data-tool="italic" title="Italic (Ctrl+I)"><em>I</em></button>
        <button type="button" class="tool" data-tool="code" title="Code">&lt;/&gt;</button>
        <button type="button" class="tool" data-tool="link" title="Link (Ctrl+K)">Link</button>
        <button type="button" class="tool" data-tool="list" title="Bullet list">&bull; List</button>
      </div>

      <label class="sr" for="editor-text">Markdown text</label>
      <textarea id="editor-text" class="editor-text" spellcheck="false" autocomplete="off"
        placeholder="Start typing Markdown here…"></textarea>

      <div class="actions">
        <span class="save-state" id="save-state" role="status" aria-live="polite">Saved</span>
        <button type="button" class="btn download big" id="export-btn">Download .md</button>
      </div>
    </section>

    <!-- Live view -->
    <section class="preview panel" data-section="preview" aria-labelledby="h-preview">
      <div class="panel-head">
        <h2 class="panel-title" id="h-preview">Live view doc</h2>
        <span class="muted" id="preview-note"></span>
      </div>
      <article class="doc glass" id="preview" aria-live="off"></article>
    </section>
  </main>

  <nav class="tabbar" aria-label="Sections" role="tablist">
    <button type="button" role="tab" data-target="cheat" aria-selected="false">Quick Cheat-Sheet</button>
    <button type="button" role="tab" data-target="editor" aria-selected="true">Editor Canvas</button>
    <button type="button" role="tab" data-target="preview" aria-selected="false">Live View Doc</button>
  </nav>

  <footer class="footer">
    <span class="watermark">Idea By: Azmat Ali</span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
